name: deidnerf_py10

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - numpy=1.23
  - click=8.1.7
  - imageio=2.31
  - kornia=0.6.12
  - matplotlib-inline=0.1.6
  - ninja
  - requests=2.31
  - tqdm=4.66

  # Stable Torch stack (DO NOT CHANGE)
  - pytorch=1.13.1
  - torchvision=0.14.1
  - pytorch-cuda=11.7
  - cuda-toolkit=11.7

  # Compiler toolchain (needed for StyleGAN ops)
  - gcc_linux-64=11
  - gxx_linux-64=11
  - sysroot_linux-64=2.17
  - binutils_linux-64

  - pip:
      # Torch-compatible ecosystem versions
