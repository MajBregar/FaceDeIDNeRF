name: deidnerf_py10

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - numpy=1.23
  - click=8.1.7
  - imageio=2.31
  - kornia=0.6.12
  - matplotlib-inline=0.1.6
  - requests=2.31
  - tqdm=4.66

  # PyTorch 2.x stack (CUDA handled by pytorch-cuda)
  - pytorch=2.1
  - torchvision=0.16
  - pytorch-cuda=11.8
  - cuda-nvcc=11.8
  - cuda-cudart-dev=11.8
  - cuda-libraries-dev=11.8
  - cuda-cccl=11.8

  # Compiler toolchain for StyleGAN custom ops
  - gcc_linux-64=11
  - gxx_linux-64=11
  - sysroot_linux-64=2.17
  - binutils_linux-64
  - cmake
  - ninja


  - pip:
